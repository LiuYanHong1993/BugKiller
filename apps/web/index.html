<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BugKiller</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <nav class="side-menu">
        <button class="menu-item primary" id="newSession" title="新建会话">
          <span class="ic" data-icon="messageSquarePlus"></span>
          <span>新建会话</span>
        </button>
        <button class="menu-item" id="navProjects" title="项目 / 产品管理">
          <span class="ic" data-icon="folderKanban"></span>
          <span>项目 / 产品管理</span>
        </button>
        <button class="menu-item" id="navOffice" title="办公套件">
          <span class="ic" data-icon="briefcase"></span>
          <span>办公套件</span>
        </button>
        <button class="menu-item" id="navAgents" title="云智能体">
          <span class="ic" data-icon="bot"></span>
          <span>云智能体</span>
        </button>
      </nav>
      <div class="side-head">
        <span>会话</span>
        <span class="spacer"></span>
        <button class="hicon" id="archToggle" title="显示/隐藏已归档">
          <span data-icon="archive" class="hic"></span>
        </button>
        <button class="hicon" id="searchToggle" title="搜索会话">
          <span data-icon="search" class="hic"></span>
        </button>
        <button class="hchip" id="projFilter" title="按分组筛选">
          <span data-icon="listFilter" class="hic"></span>
          <span id="projFilterName">项目</span>
          <span class="cv">▾</span>
        </button>
      </div>
      <div class="side-search" id="searchRow" style="display:none">
        <input id="sessionSearch" placeholder="搜索会话标题或 ID" />
      </div>
      <div id="sessionList"></div>
      <button id="account" type="button" title="账号与设置">
        <div class="avatar">本</div>
        <div class="acc-tx"><div class="nm">本地账号</div><div class="sub">单机模式</div></div>
        <span class="acc-toggle" title="收起">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 10l4-4 4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
      <div id="meta" class="meta" style="display:none"></div>
    </aside>
    <main id="main">
      <header id="topbar">
        <div id="sessTitle">BugKiller</div>
        <span class="spacer"></span>
        <button type="button" class="cbtn" id="wsBtn" title="会话工作区（文件查看 / 编辑）"></button>
      </header>
      <div id="tabs">
        <button class="tab active" data-tab="dialog">对话</button>
        <button class="tab" data-tab="trace">轨迹</button>
        <button class="tab" data-tab="ctx">上下文</button>
      </div>
      <div id="streamScroll"><div id="stream"></div></div>
      <div id="composerWrap">
        <div id="planCard"><span class="ic">📋</span><span id="planTx">就绪 · 等待任务</span></div>
        <div id="editBanner" style="display:none">✎ 正在编辑历史消息 <button class="pbtn" id="editCancel" type="button">取消</button></div>
        <div id="attachRow" style="display:none"></div>
        <input type="file" id="fileInput" multiple style="display:none" />
        <div id="composer">
          <textarea id="input" rows="1" placeholder="继续追问，输入 / 调用命令…"></textarea>
          <div class="composer-foot">
            <button class="cbtn" id="attachBtn" title="附件（即将支持）">＋</button>
            <button class="cbtn" id="permBadge" title="当前权限模式">权限 …</button>
            <button class="model-sel" id="modelSel">… <span>▾</span></button>
            <button class="cbtn" id="paramsBtn" title="模型参数（temperature / max tokens）">⚙</button>
            <button id="send" disabled>➤</button>
          </div>
        </div>
      </div>
      <div id="statusbar">
        <span><span class="v" id="sbRounds">0</span> 轮 <span class="v" id="sbSteps">0</span> 步</span>
        <span class="sep"></span>
        <span><span class="v" id="sbTokens">0</span> tok</span>
        <span class="sep"></span>
        <span><span class="v" id="sbSessions">0</span> 会话</span>
        <span class="sep"></span>
        <span id="sbInfo">BugKiller v0.2.0 · 本地内核</span>
      </div>
    </main>
  </div>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
